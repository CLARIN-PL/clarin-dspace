<VirtualHost *:80>
    ServerName ${APACHE_SERVER_NAME}
    ServerAdmin dspace@clarin-pl.eu
    UseCanonicalName On

    DocumentRoot /var/www/html
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/dspace-shibboleth.error.log
    CustomLog ${APACHE_LOG_DIR}/dspace-shibboleth.access.log combined

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300

    # TLS terminates at the public reverse proxy. Tell Shibboleth to construct
    # and validate its handlers as HTTPS while Apache talks HTTP internally.
    ShibURLScheme https

    # The production image always installs and enables mod_shib. Keep these
    # directives unconditional so a missing module fails Apache startup instead
    # of silently disabling every handler and returning misleading HTTP 404s.
    # Lazy sessions keep all public repository content anonymous.
    <Location />
        AuthType shibboleth
        ShibRequireSession Off
        Require shibboleth
    </Location>

    # Only this DSpace endpoint may receive attributes from mod_shib.
    <Location "/server/api/authn/shibboleth">
        AuthType shibboleth
        ShibRequireSession On
        ShibUseHeaders On
        Require shibboleth
    </Location>

    # The normal login endpoint must continue to advertise all methods.
    <Location "/server/api/authn/login">
        AuthType shibboleth
        ShibRequireSession Off
        ShibUseHeaders On
        Require shibboleth
    </Location>

    <Location "/shibboleth/Shibboleth.sso">
        # Shibboleth SP 3 discovers handler requests from handlerURL.  Debian's
        # supported Apache configuration explicitly disables authentication on
        # this endpoint.  Set the module content handler as well as the explicit
        # authentication override so the enclosing lazy-session rule is not
        # inherited by handler requests.
        SetHandler shib
        AuthType None
        Require all granted
    </Location>

    ProxyPass /shibboleth/Shibboleth.sso !

    <Proxy "*">
        AddDefaultCharset Off
        Require all granted
    </Proxy>

    ProxyPass /server http://dspace:8080/server retry=0 timeout=300
    ProxyPassReverse /server http://dspace:8080/server
</VirtualHost>
