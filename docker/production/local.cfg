# Non-secret production defaults for the CLARIN-PL container deployment.
# URLs, database credentials and cryptographic secrets are injected by Compose.

# Compose injects mail.server.disabled per environment. Do not override it here.
# Port 587 must upgrade to TLS before SMTP authentication; verify the server certificate.
mail.extraproperties = mail.smtp.starttls.enable=true, mail.smtp.starttls.required=true, mail.smtp.ssl.checkserveridentity=true
user.registration = false

dspace.name = CLARIN-PL Repository
default.language = en_US
lr.help.mail = dspace@clarin-pl.eu

# The DSpace 5 bitstreams are reused in place. Compose bind-mounts the external
# assetstore here, and the migration endpoint registers the existing internal IDs.
assetstore.dir = /dspace/assetstore
assetstore.index.primary = 0

# All 833 persistent identifiers in the 2026 source dump use this prefix.
handle.prefix = 11321
handle.canonical.prefix = https://hdl.handle.net/
handle.additional.prefixes =
handle.plugin.checknameauthority = false
lr.pid.community.configurations = community=*,prefix=11321,type=local,canonical_prefix=https://hdl.handle.net/

# Keep the Polish repository identity when the OAI index is rebuilt after import.
oai.identifier.prefix = clarin-pl.eu
description.currentAsOf = 2026-09-24
description.archiveURL = https://clarin-pl.eu/dspace/
description.participant.name = CLARIN-PL Repository Team
help.mail = dspace@clarin-pl.eu
description.institution = Wrocław University of Science and Technology
description.institutionURL = https://pwr.edu.pl/en/
description.shortLocation = Wrocław (Poland)
description.location = Wybrzeże Wyspiańskiego 27; 50-370 Wrocław; Poland
description.synopsis = CLARIN-PL digital repository for language resources and tools
description.access = https://clarin-pl.eu/dspace/static/about
description.archivalSubmissionPolicy = https://clarin-pl.eu/dspace/static/deposit

# Keep local password authentication and CLARIN federated authentication enabled together.
plugin.sequence.org.dspace.authenticate.AuthenticationMethod = org.dspace.authenticate.PasswordAuthentication,org.dspace.authenticate.clarin.ClarinShibAuthentication

# DSpace-side Shibboleth attributes retained from the CLARIN-PL installation.
# The SP proxy and federation metadata are provided by the production Compose stack.
# The SP key and certificate remain external read-only deployment secrets.
authentication-shibboleth.lazysession = true
authentication-shibboleth.lazysession.loginurl = /shibboleth/Shibboleth.sso/Login
authentication-shibboleth.lazysession.secure = true
authentication-shibboleth.netid-header = eppn,subject-id,pairwise-id,persistent-id
authentication-shibboleth.email-header = mail
authentication-shibboleth.email-use-tomcat-remote-user = false
authentication-shibboleth.autoregister = true
authentication-shibboleth.firstname-header = givenName
authentication-shibboleth.lastname-header = sn
authentication-shibboleth.lastname-header-fallback = cn
authentication-shibboleth.eperson.metadata.autocreate = true
authentication-shibboleth.reconvert.attributes = false
authentication-shibboleth.role-header = entitlement
authentication-shibboleth.role-header.ignore-scope = false
authentication-shibboleth.role-header.ignore-value = true
authentication-shibboleth.default.auth.group = Authenticated
authentication-shibboleth.clarin.custom.groups =
authentication-shibboleth.header.entitlement =
authentication-shibboleth.header.unscoped-affiliation =
authentication-shibboleth.role.ufal.mff.cuni.cz =
shibboleth.discofeed.allowed = false

# Only the reverse proxy is trusted. Keep this synchronized with compose.yml.
proxies.trusted.ipranges = 172.30.37

# These optional checks call services that start after the backend and would
# otherwise create a circular Compose health dependency. Database and Solr
# health checks remain enabled.
management.health.seo.enabled = false
management.health.geoIp.enabled = false

# The Angular UI and REST API are exposed on one public origin.
rest.cors.allowed-origins = ${dspace.ui.url}

# Conservative connection pool defaults for a single backend instance.
db.maxconnections = 30
db.maxidle = 10
db.maxwait = 10000
# Migration-only performance switches. Keep both false in normal operation;
# compose.migration.yml overrides them only while registering legacy records.
clarin.item-files-metadata.deferred = false
clarin.bitstream.validation.deferred = false
