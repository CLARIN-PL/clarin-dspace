# Non-secret production defaults for the CLARIN-PL container deployment.
# URLs, database credentials and cryptographic secrets are injected by Compose.

mail.server.disabled = true
user.registration = false

# Only the reverse proxy is trusted. Keep this synchronized with compose.yml.
proxies.trusted.ipranges = 172.30.37

# These optional checks call services that start after the backend and would
# otherwise create a circular Compose health dependency. Database and Solr
# health checks remain enabled.
management.health.seo.enabled = false
management.health.geoIp.enabled = false

# The Angular UI and REST API are exposed on one public origin.
rest.cors.allowed-origins = ${dspace.ui.url}

# Conservative connection pool defaults for a single backend instance.
db.maxconnections = 30
db.maxidle = 10
db.maxwait = 10000
